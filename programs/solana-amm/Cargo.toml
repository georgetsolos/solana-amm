
[package]
name = "solana-amm"
version = "0.1.0"
description = "Solana Automated Market Maker"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_amm"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.1"
anchor-spl = { version = "1.2.1", features = ["token", "associated_token"] }

[dev-dependencies]
litesvm = "0.18.2"
solana-message = "3.0.1"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
litesvm-token = "0.18.2"
solana-address = "2.7.0"
solana-instruction = "3.5.1"
sha2 = "0.10.9"
spl-associated-token-account-interface = "2.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
